# Calls the backend every 5 minutes so Render never puts it to sleep.
# Backup for the backend's own keep-alive (backend/src/services/keepAlive.js): this one runs
# outside Render, so it can also wake the service if it ever went to sleep.
# GitHub may start scheduled runs a few minutes late; that is fine (Render sleeps after 15).
# Set the repository variable BACKEND_URL to change the address.
name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://mpod.onrender.com' }}
        run: |
          # A sleeping free-plan service takes up to a minute to start, hence the long timeout and retries.
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            "$BACKEND_URL/backend/api/ping"
